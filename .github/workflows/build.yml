name: build-exe
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flask requests qrcode pyinstaller
      - run: pyinstaller --onefile --noconsole --name GFDrop --add-data "static;static" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: GFDrop
          path: dist/GFDrop.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/GFDrop.exe
