name: build-exe
on:
  push:
    tags: ['v*']          # v0.2.0 gibi etiket atinca: test + exe + kurulum paketi + Release
  workflow_dispatch:      # elle calistirma
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: pyinstaller --onefile --noconsole --name GFDrop --add-data "static;static" app.py
      - name: Surumu app.py'den oku
        shell: pwsh
        run: |
          $v = (Select-String -Path app.py -Pattern 'VERSION = "(.*)"').Matches.Groups[1].Value
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\GFDrop.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: GFDrop
          path: |
            Output/GFDrop-Setup.exe
            dist/GFDrop.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Output/GFDrop-Setup.exe
            dist/GFDrop.exe
